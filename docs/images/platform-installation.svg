<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Platform installation paths</title>
  <desc id="desc">Four platforms install or discover the package and finish with a smoke test against the same Skill.</desc>
  <defs><style>.bg{fill:#f7fafc}.title{font:700 30px sans-serif;fill:#102a43}.h{font:700 18px sans-serif;fill:#102a43}.p{font:15px sans-serif;fill:#486581}.lane{fill:#fff;stroke:#d9e2ec;stroke-width:2}.step{fill:#e8f1ff;stroke:#2f80ed;stroke-width:2}.check{fill:#d9f7ef;stroke:#0f9d83;stroke-width:2}.core{fill:#fff4d6;stroke:#d99b18;stroke-width:2}.line{stroke:#7b8794;stroke-width:2.5;fill:none}.arrow{fill:#7b8794}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path class="arrow" d="M0,0 L9,3 L0,6 Z"/></marker></defs>
  <rect class="bg" width="1200" height="610" rx="24"/><text class="title" x="58" y="60">Install, discover, verify</text><text class="p" x="58" y="89">Each harness has a thin adapter and its own runtime check.</text>
  <rect class="lane" x="55" y="125" width="1090" height="86" rx="14"/><text class="h" x="80" y="175">Codex</text><rect class="step" x="220" y="145" width="220" height="46" rx="10"/><text class="p" x="330" y="174" text-anchor="middle">plugin.json / marketplace</text><path class="line" marker-end="url(#arrow)" d="M440 168 L510 168"/><rect class="check" x="510" y="145" width="250" height="46" rx="10"/><text class="p" x="635" y="174" text-anchor="middle">list + explicit request</text>
  <rect class="lane" x="55" y="225" width="1090" height="86" rx="14"/><text class="h" x="80" y="275">Claude Code</text><rect class="step" x="220" y="245" width="220" height="46" rx="10"/><text class="p" x="330" y="274" text-anchor="middle">plugin-dir / plugin.json</text><path class="line" marker-end="url(#arrow)" d="M440 268 L510 268"/><rect class="check" x="510" y="245" width="250" height="46" rx="10"/><text class="p" x="635" y="274" text-anchor="middle">load + explicit request</text>
  <rect class="lane" x="55" y="325" width="1090" height="86" rx="14"/><text class="h" x="80" y="375">Gemini CLI</text><rect class="step" x="220" y="345" width="220" height="46" rx="10"/><text class="p" x="330" y="374" text-anchor="middle">extension + GEMINI.md</text><path class="line" marker-end="url(#arrow)" d="M440 368 L510 368"/><rect class="check" x="510" y="345" width="250" height="46" rx="10"/><text class="p" x="635" y="374" text-anchor="middle">list + smoke test</text>
  <rect class="lane" x="55" y="425" width="1090" height="86" rx="14"/><text class="h" x="80" y="475">Copilot CLI</text><rect class="step" x="220" y="445" width="220" height="46" rx="10"/><text class="p" x="330" y="474" text-anchor="middle">local marketplace</text><path class="line" marker-end="url(#arrow)" d="M440 468 L510 468"/><rect class="check" x="510" y="445" width="250" height="46" rx="10"/><text class="p" x="635" y="474" text-anchor="middle">install + explicit request</text>
  <path class="line" marker-end="url(#arrow)" d="M760 168 C840 168 840 315 930 315"/><path class="line" marker-end="url(#arrow)" d="M760 268 C840 268 840 315 930 315"/><path class="line" marker-end="url(#arrow)" d="M760 368 C840 368 840 315 930 315"/><path class="line" marker-end="url(#arrow)" d="M760 468 C840 468 840 315 930 315"/>
  <rect class="core" x="930" y="265" width="185" height="100" rx="16"/><text class="h" x="1022" y="305" text-anchor="middle">Canonical</text><text class="p" x="1022" y="330" text-anchor="middle">engineering-</text><text class="p" x="1022" y="350" text-anchor="middle">workflow Skill</text>
</svg>
