<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Engineering Workflow risk levels</title>
  <desc id="desc">Quick, Standard, Strict, and Explore are selected according to impact and uncertainty.</desc>
  <defs><style>.bg{fill:#f7fafc}.title{font:700 30px sans-serif;fill:#102a43}.h{font:700 20px sans-serif;fill:#102a43}.p{font:15px sans-serif;fill:#486581}.quick{fill:#d9f7ef;stroke:#0f9d83}.standard{fill:#e8f1ff;stroke:#2f80ed}.strict{fill:#ffe4e1;stroke:#d64545}.explore{fill:#fff4d6;stroke:#d99b18}.card{stroke-width:2}.arrow{stroke:#7b8794;stroke-width:3;fill:none}</style></defs>
  <rect class="bg" width="1200" height="500" rx="24"/><text class="title" x="58" y="62">Choose the lightest credible route</text><text class="p" x="58" y="91">Escalate when impact, uncertainty, or verification demands it.</text>
  <rect class="card quick" x="55" y="145" width="250" height="250" rx="18"/><text class="h" x="85" y="190">Quick</text><text class="p" x="85" y="225">Local and reversible</text><text class="p" x="85" y="254">Known callers</text><text class="p" x="85" y="283">Focused check</text><text class="p" x="85" y="340">Smallest edit,</text><text class="p" x="85" y="366">direct evidence</text>
  <rect class="card standard" x="335" y="145" width="250" height="250" rx="18"/><text class="h" x="365" y="190">Standard</text><text class="p" x="365" y="225">Behavior change</text><text class="p" x="365" y="254">Ordinary bug or refactor</text><text class="p" x="365" y="283">Regression checks</text><text class="p" x="365" y="340">Test-first or strongest</text><text class="p" x="365" y="366">repeatable evidence</text>
  <rect class="card strict" x="615" y="145" width="250" height="250" rx="18"/><text class="h" x="645" y="190">Strict</text><text class="p" x="645" y="225">Public or security-sensitive</text><text class="p" x="645" y="254">Data, dependency, production</text><text class="p" x="645" y="283">External or irreversible</text><text class="p" x="645" y="340">Authorization, rollback,</text><text class="p" x="645" y="366">plan, boundary checks</text>
  <rect class="card explore" x="895" y="145" width="250" height="250" rx="18"/><text class="h" x="925" y="190">Explore</text><text class="p" x="925" y="225">Spike or unknown legacy</text><text class="p" x="925" y="254">Isolated and reversible</text><text class="p" x="925" y="283">Learning goal</text><text class="p" x="925" y="340">Label exploratory</text><text class="p" x="925" y="366">before promotion</text>
</svg>
