<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Engineering Workflow delivery path</title>
  <desc id="desc">A repository task moves from classification to scoped work, evidence, and handoff.</desc>
  <defs><style>.bg{fill:#f7fafc}.title{font:700 30px sans-serif;fill:#102a43}.label{font:700 18px sans-serif;fill:#102a43}.small{font:15px sans-serif;fill:#486581}.step{fill:#e8f1ff;stroke:#2f80ed;stroke-width:2}.gate{fill:#fff4d6;stroke:#d99b18;stroke-width:2}.done{fill:#d9f7ef;stroke:#0f9d83;stroke-width:2}.line{stroke:#7b8794;stroke-width:3;fill:none}.arrow{fill:#7b8794}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path class="arrow" d="M0,0 L9,3 L0,6 Z"/></marker></defs>
  <rect class="bg" width="1200" height="420" rx="24"/><text class="title" x="58" y="62">Evidence-driven delivery path</text>
  <rect class="step" x="50" y="145" width="180" height="110" rx="16"/><text class="label" x="140" y="185" text-anchor="middle">1. Classify</text><text class="small" x="140" y="215" text-anchor="middle">answer, review,</text><text class="small" x="140" y="237" text-anchor="middle">diagnose, change</text>
  <rect class="gate" x="270" y="145" width="180" height="110" rx="16"/><text class="label" x="360" y="185" text-anchor="middle">2. Route</text><text class="small" x="360" y="215" text-anchor="middle">Quick / Standard</text><text class="small" x="360" y="237" text-anchor="middle">Strict / Explore</text>
  <rect class="step" x="490" y="145" width="180" height="110" rx="16"/><text class="label" x="580" y="185" text-anchor="middle">3. Inspect</text><text class="small" x="580" y="215" text-anchor="middle">scope, callers,</text><text class="small" x="580" y="237" text-anchor="middle">tests, constraints</text>
  <rect class="step" x="710" y="145" width="180" height="110" rx="16"/><text class="label" x="800" y="185" text-anchor="middle">4. Verify</text><text class="small" x="800" y="215" text-anchor="middle">fresh evidence</text><text class="small" x="800" y="237" text-anchor="middle">after final edit</text>
  <rect class="done" x="930" y="145" width="220" height="110" rx="16"/><text class="label" x="1040" y="185" text-anchor="middle">5. Hand off</text><text class="small" x="1040" y="215" text-anchor="middle">files, commands,</text><text class="small" x="1040" y="237" text-anchor="middle">limits, follow-up</text>
  <path class="line" marker-end="url(#arrow)" d="M230 200 L270 200"/><path class="line" marker-end="url(#arrow)" d="M450 200 L490 200"/><path class="line" marker-end="url(#arrow)" d="M670 200 L710 200"/><path class="line" marker-end="url(#arrow)" d="M890 200 L930 200"/>
  <text class="small" x="600" y="335" text-anchor="middle">No unverified completion claims: the final handoff names what the evidence proves and what remains unknown.</text>
</svg>
